<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="22" font-weight="700" fill="#0F172A">怎么选：三条问题就能定下来</text>

  <!-- 起点 -->
  <rect x="490" y="52" width="220" height="40" rx="8" fill="#0F172A"/>
  <text x="600" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Java 需要用到 Python 的能力</text>

  <!-- 分叉骨架 -->
  <path d="M600 92 V118" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <path d="M200 118 H1000" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <path d="M200 118 V140" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <path d="M600 118 V140" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <path d="M1000 118 V140" stroke="#94A3B8" stroke-width="1.6" fill="none"/>

  <!-- Q 层 -->
  <g>
    <rect x="50" y="140" width="300" height="62" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="200" y="164" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Q：一次性脚本还是在线服务？</text>
    <text x="200" y="186" font-size="12" fill="#475569" text-anchor="middle">定时跑 / 一天几次 / 离线批处理</text>

    <rect x="450" y="140" width="300" height="62" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="600" y="164" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Q：用户要等这个结果吗？</text>
    <text x="600" y="186" font-size="12" fill="#475569" text-anchor="middle">同步返回，通常要求秒级内</text>

    <rect x="850" y="140" width="300" height="62" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="1000" y="164" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Q：这个任务要跑多久？</text>
    <text x="1000" y="186" font-size="12" fill="#475569" text-anchor="middle">分钟级、小时级，允许异步</text>
  </g>

  <path d="M200 202 V232" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <path d="M600 202 V232" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <path d="M1000 202 V232" stroke="#94A3B8" stroke-width="1.6" fill="none"/>

  <!-- 结果层 -->
  <g>
    <rect x="50" y="232" width="300" height="86" rx="8" fill="#F1F5F9" stroke="#475569"/>
    <text x="200" y="258" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">方案 B · 子进程 CLI</text>
    <text x="200" y="280" font-size="12" fill="#334155" text-anchor="middle">ProcessBuilder 起 python 脚本</text>
    <text x="200" y="300" font-size="12" fill="#334155" text-anchor="middle">stdin 传参 / stdout 收 JSON</text>

    <rect x="450" y="232" width="300" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="600" y="258" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="middle">方案 A · HTTP / REST</text>
    <text x="600" y="280" font-size="12" fill="#334155" text-anchor="middle">RestClient → FastAPI</text>
    <text x="600" y="300" font-size="12" fill="#334155" text-anchor="middle">JSON 进出，独立部署独立扩容</text>

    <rect x="850" y="232" width="300" height="86" rx="8" fill="#F1F5F9" stroke="#475569"/>
    <text x="1000" y="258" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">方案 C · 消息队列</text>
    <text x="1000" y="280" font-size="12" fill="#334155" text-anchor="middle">Java 投递任务，Python worker 消费</text>
    <text x="1000" y="300" font-size="12" fill="#334155" text-anchor="middle">回调 / 轮询拿结果</text>
  </g>

  <!-- 中列继续 -->
  <path d="M600 318 V352" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <rect x="440" y="352" width="320" height="58" rx="8" fill="#FFFBEB" stroke="#D97706"/>
  <text x="600" y="376" font-size="13" font-weight="700" fill="#78350F" text-anchor="middle">压测之后，HTTP 真的是瓶颈吗？</text>
  <text x="600" y="398" font-size="12" fill="#78350F" text-anchor="middle">QPS 很高、延迟要求个位数毫秒、字段稳定</text>

  <path d="M600 410 V432 H450 V462" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <path d="M600 410 V432 H750 V462" stroke="#94A3B8" stroke-width="1.6" fill="none"/>

  <rect x="300" y="462" width="300" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="450" y="488" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">否 → 留在 HTTP</text>
  <text x="450" y="510" font-size="12" fill="#334155" text-anchor="middle">先加连接池、超时、重试、缓存，</text>
  <text x="450" y="528" font-size="12" fill="#334155" text-anchor="middle">九成问题在这一步就解决了</text>

  <rect x="620" y="462" width="300" height="76" rx="8" fill="#F1F5F9" stroke="#475569"/>
  <text x="770" y="488" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">是 → 方案 D · gRPC</text>
  <text x="770" y="510" font-size="12" fill="#334155" text-anchor="middle">protobuf 强契约 + 二进制传输</text>
  <text x="770" y="528" font-size="12" fill="#334155" text-anchor="middle">代价：多维护一份 .proto</text>

  <rect x="40" y="566" width="1120" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="60" y="590" font-size="13" font-weight="700" fill="#0F172A">默认答案：HTTP</text>
  <text x="150" y="590" font-size="13" fill="#334155">先把 HTTP 链路跑通，加上超时、重试、熔断和监控；等监控数据真的指向 HTTP 层，再换 gRPC。顺序反了，只会多维护一套 protobuf 而没解决真问题。</text>
</svg>
