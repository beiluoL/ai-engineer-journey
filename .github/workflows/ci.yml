name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests + docs check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Project 01 unit tests
        working-directory: projects/01-python-ai-cli/src
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Install Project 02 with dev dependencies
        working-directory: projects/02-engineering-ai-assistant
        run: pip install -e ".[dev]"

      - name: Run Project 02 tests (pytest, offline with FakeClient)
        working-directory: projects/02-engineering-ai-assistant
        run: pytest -q --cov=assistant --cov-report=term

      - name: Check doc links and images
        run: python scripts/check_links.py --strict

      - name: Verify no secret files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.key$'; then
            echo "::error::发现疑似密钥文件被提交"
            exit 1
          fi
          echo "no secret files tracked"
