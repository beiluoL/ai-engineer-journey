<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="680" height="404" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="a11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="404" fill="#ffffff"/>
  <text x="20" y="27" font-size="16" font-weight="700" fill="#1f2328">M11 Complete System：可缓存 / 可分段重跑 / 报告可机读</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">Capstone 交付的不是模型，而是一条能反复跑的流水线 —— 有缓存时全程 0.93 秒</text>

  <!-- pipeline stages -->
  <g font-size="8.5" fill="#1f2328">
    <rect x="20" y="62" width="76" height="34" rx="5" fill="#ffffff" stroke="#8c959f"/><text x="30" y="76">① config</text><text x="30" y="88" fill="#57606a">0.000 s</text>
    <rect x="101" y="62" width="76" height="34" rx="5" fill="#f0f0f0" stroke="#8c959f" stroke-dasharray="3,2"/><text x="111" y="76">② tokenizer</text><text x="111" y="88" fill="#57606a">复用</text>
    <rect x="182" y="62" width="76" height="34" rx="5" fill="#ffffff" stroke="#8c959f"/><text x="192" y="76">③ dataset</text><text x="192" y="88" fill="#57606a">0.005 s</text>
    <rect x="263" y="62" width="76" height="34" rx="5" fill="#ffffff" stroke="#8c959f"/><text x="273" y="76">④ model</text><text x="273" y="88" fill="#57606a">0.004 s</text>
    <rect x="344" y="62" width="76" height="34" rx="5" fill="#f0f0f0" stroke="#8c959f" stroke-dasharray="3,2"/><text x="354" y="76">⑤ train</text><text x="354" y="88" fill="#57606a">复用</text>
    <rect x="425" y="62" width="76" height="34" rx="5" fill="#ffffff" stroke="#8c959f"/><text x="435" y="76">⑥ evaluate</text><text x="435" y="88" fill="#57606a">0.116 s</text>
    <rect x="506" y="62" width="76" height="34" rx="5" fill="#ffffff" stroke="#8c959f"/><text x="516" y="76">⑦ optimize</text><text x="516" y="88" fill="#57606a">0.222 s</text>
    <rect x="587" y="62" width="73" height="34" rx="5" fill="#ffffff" stroke="#8c959f"/><text x="597" y="76">⑧ serve</text><text x="597" y="88" fill="#57606a">0.579 s</text>
  </g>
  <text x="20" y="112" font-size="10" fill="#57606a">灰底 = 命中缓存，不计时（分词器与模型权重都直接读回，不重算）</text>

  <!-- artifacts -->
  <rect x="20" y="124" width="313" height="112" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="32" y="142" font-size="11.5" font-weight="700" fill="#1f2328">磁盘产物：每个数字都能追溯到某次运行</text>
  <g font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1f2328">
    <text x="34" y="162">tokenizer.json      37.2 KB   词表（+权重同生共死）</text>
    <text x="34" y="177">tiny_lm_best.npz   5421.6 KB   早停回滚后的权重 ← 复用源</text>
    <text x="34" y="192">tiny_lm.npz        5421.6 KB   最后一步的权重</text>
    <text x="34" y="207">config.json          1.1 KB   这份报告是哪份配置跑出来的</text>
    <text x="34" y="222">report.json         19.5 KB   训练/评估/优化/服务四份报告</text>
  </g>

  <rect x="347" y="124" width="313" height="112" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="359" y="142" font-size="11.5" font-weight="700" fill="#1f2328">三条工程属性（都实测过）</text>
  <text x="361" y="162" font-size="10" fill="#1f2328">① 可缓存：第二次运行 cached = {tokenizer: true, model: true}</text>
  <text x="369" y="176" font-size="9.5" fill="#57606a">训练阶段耗时 0.000 s —— 不重训</text>
  <text x="361" y="194" font-size="10" fill="#1f2328">② 可分段：only=[config, tokenizer, dataset]</text>
  <text x="369" y="208" font-size="9.5" fill="#57606a">model 为 None —— 没跑到就不建</text>
  <text x="361" y="226" font-size="10" fill="#1f2328">③ 可机读：report.json 顶层 7 个字段，可直接 diff 两次实验</text>

  <!-- summary table -->
  <rect x="20" y="246" width="640" height="106" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="264" font-size="11.5" font-weight="700" fill="#1f2328">11 章关键数字汇总（这张表就是 Capstone 的交付物）</text>
  <g font-size="9.5" font-family="'SF Mono',Menlo,monospace" fill="#1f2328">
    <text x="34" y="284">M01 架构      8 个阶段           M02 分词器   1.44 字/token，unk 0.33%</text>
    <text x="34" y="299">M03 数据集    train 206/val 37   M04 Embedding  81,920 参数（占 35.6%）</text>
    <text x="34" y="314">M05 Block     因果自检误差 0      M06 训练      早停回滚到第 800 步，PPL 315.79</text>
    <text x="34" y="329">M07 评估      ECE 0.0709         M08 推理      KV Cache 等价误差 3.4e-15</text>
    <text x="34" y="344">M09 优化      INT8 压缩 3.85×，ΔPPL +0.08%     M10 服务  四项冒烟全过，120.9 req/s</text>
  </g>

  <rect x="20" y="362" width="640" height="34" rx="8" fill="#fdf6e3" stroke="#c9a227" stroke-width="1.5"/>
  <text x="32" y="376" font-size="10.5" font-weight="700" fill="#1f2328">一次跑完：0.93 s（有缓存） —— 冷启动需要真训 1200 步，约 26 s（实测 46.5 step/s）</text>
  <text x="32" y="391" font-size="9.5" fill="#57606a">最重的一段是 serve：起服务 + 冒烟 + 压测，是整条链路里唯一有并发与网络的部分</text>
</svg>
