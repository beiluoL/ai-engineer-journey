<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <text x="20" y="27" font-size="16" font-weight="700" fill="#1f2328">M01 架构：一条 8 段流水线，三层复用</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">P10 不重写任何已被证明的实现，只做「串联 + 工程化」——这本身就是 Capstone 要证明的能力</text>

  <!-- reuse layers -->
  <rect x="20" y="62" width="640" height="86" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="80" font-size="11.5" font-weight="700" fill="#1f2328">只读底座（三个同级项目的 src 目录，由 paths.py 挂进 sys.path）</text>
  <rect x="34" y="90" width="196" height="46" rx="6" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.2"/>
  <text x="44" y="107" font-size="10.5" font-weight="700" fill="#1f2328">P06  06-mini-transformer-llm</text>
  <text x="46" y="121" font-size="9.5" fill="#57606a">手写 Tensor/autograd、TransformerLM</text>
  <text x="46" y="132" font-size="9.5" fill="#57606a">BPETokenizer / CharTokenizer</text>
  <rect x="242" y="90" width="196" height="46" rx="6" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.2"/>
  <text x="252" y="107" font-size="10.5" font-weight="700" fill="#1f2328">P08  08-fine-tuning</text>
  <text x="254" y="121" font-size="9.5" fill="#57606a">确定性 autograd 补丁</text>
  <text x="254" y="132" font-size="9.5" fill="#57606a">（_prev 从 set 换成有序 list）</text>
  <rect x="450" y="90" width="196" height="46" rx="6" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.2"/>
  <text x="460" y="107" font-size="10.5" font-weight="700" fill="#1f2328">P09  09-evaluation-inference</text>
  <text x="462" y="121" font-size="9.5" fill="#57606a">评估指标 / 量化 / KV Cache 账本</text>
  <text x="462" y="132" font-size="9.5" fill="#57606a">OpenAI 兼容 HTTP 服务</text>

  <line x1="340" y1="150" x2="340" y2="164" stroke="#57606a" stroke-width="1.4" marker-end="url(#a1)"/>

  <!-- own modules -->
  <rect x="20" y="166" width="640" height="118" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="32" y="184" font-size="11.5" font-weight="700" fill="#1f2328">P10 自己写的十一个模块（src/tiny/，纯 numpy + 标准库）</text>
  <g font-size="9.5" fill="#1f2328">
    <rect x="34" y="192" width="118" height="34" rx="5" fill="#ffffff" stroke="#4a9d5f"/><text x="42" y="207">paths 路径+导入</text><text x="42" y="219" fill="#57606a">跨项目 sys.path</text>
    <rect x="158" y="192" width="118" height="34" rx="5" fill="#ffffff" stroke="#4a9d5f"/><text x="166" y="207">config 配置契约</text><text x="166" y="219" fill="#57606a">唯一入口 + 校验</text>
    <rect x="282" y="192" width="118" height="34" rx="5" fill="#ffffff" stroke="#4a9d5f"/><text x="290" y="207">tok 分词器</text><text x="290" y="219" fill="#57606a">往返 + OOV 归因</text>
    <rect x="406" y="192" width="118" height="34" rx="5" fill="#ffffff" stroke="#4a9d5f"/><text x="414" y="207">data 数据集</text><text x="414" y="219" fill="#57606a">清洗/切分/滑窗</text>
    <rect x="530" y="192" width="118" height="34" rx="5" fill="#ffffff" stroke="#4a9d5f"/><text x="538" y="207">model 模型装配</text><text x="538" y="219" fill="#57606a">参数账 + 因果自检</text>
    <rect x="34" y="234" width="118" height="34" rx="5" fill="#ffffff" stroke="#4a9d5f"/><text x="42" y="249">train 训练</text><text x="42" y="261" fill="#57606a">调度/裁剪/早停</text>
    <rect x="158" y="234" width="118" height="34" rx="5" fill="#ffffff" stroke="#4a9d5f"/><text x="166" y="249">evaluate 评估</text><text x="166" y="261" fill="#57606a">语言/校准/生成</text>
    <rect x="282" y="234" width="118" height="34" rx="5" fill="#ffffff" stroke="#4a9d5f"/><text x="290" y="249">infer 推理</text><text x="290" y="261" fill="#57606a">采样 + KV + 流式</text>
    <rect x="406" y="234" width="118" height="34" rx="5" fill="#ffffff" stroke="#4a9d5f"/><text x="414" y="249">optimize 优化</text><text x="414" y="261" fill="#57606a">量化 + 显存账</text>
    <rect x="530" y="234" width="118" height="34" rx="5" fill="#ffffff" stroke="#4a9d5f"/><text x="538" y="249">serve 服务化</text><text x="538" y="261" fill="#57606a">冒烟 + 压测</text>
  </g>
  <rect x="34" y="272" width="614" height="6" rx="3" fill="#4a9d5f" opacity="0.25"/>
  <text x="42" y="274" font-size="9.5" fill="#4a9d5f"></text>

  <line x1="340" y1="284" x2="340" y2="298" stroke="#57606a" stroke-width="1.4" marker-end="url(#a1)"/>

  <!-- pipeline -->
  <rect x="20" y="300" width="640" height="34" rx="6" fill="#fdf6e3" stroke="#c9a227" stroke-width="1.3"/>
  <text x="32" y="313" font-size="10.5" font-weight="700" fill="#1f2328">pipeline 端到端编排　—　一条命令跑完，产物全部可缓存</text>
  <text x="32" y="327" font-size="9.5" fill="#57606a">config → tokenizer → dataset → model → train → evaluate → optimize → serve</text>

  <rect x="20" y="344" width="207" height="46" rx="6" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.2"/>
  <text x="32" y="361" font-size="10.5" font-weight="700" fill="#1f2328">三条硬规矩</text>
  <text x="34" y="375" font-size="9.5" fill="#1f2328">① 可调项只进 TinyConfig</text>
  <text x="34" y="386" font-size="9.5" fill="#1f2328">② 建模型前先校验自洽</text>
  <rect x="237" y="344" width="207" height="46" rx="6" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.2"/>
  <text x="249" y="361" font-size="10.5" font-weight="700" fill="#1f2328">产物可追溯</text>
  <text x="251" y="375" font-size="9.5" fill="#1f2328">models/config.json 必留一份</text>
  <text x="251" y="386" font-size="9.5" fill="#1f2328">报告里每个数字都能对上它</text>
  <rect x="454" y="344" width="206" height="46" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.2"/>
  <text x="466" y="361" font-size="10.5" font-weight="700" fill="#1f2328">一个反例</text>
  <text x="468" y="375" font-size="9.5" fill="#1f2328">超参散落各脚本 ⇒ 实验不可复现</text>
  <text x="468" y="386" font-size="9.5" fill="#1f2328">P08/P09 都踩过「各自抄了一份默认值」</text>
</svg>
