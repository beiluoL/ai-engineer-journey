[project]
name = "tiny-llm-capstone"
version = "0.1.0"
description = "Project 10 — Tiny LLM / AI Engineer Capstone：Tokenizer → Dataset → Model → Training → Evaluation → Inference → Optimization → Serving 全链路"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
