<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">M03 指令微调：prompt / answer 的分界线，就是 mask 的分界线</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">x = ids[:-1]，y = ids[1:]，mask[i] = 1 当且仅当 i+1 ≥ n_prompt —— 只有 1 的位置进 loss。</text>

  <!-- ids 行 -->
  <text x="20" y="78" font-size="11" font-weight="600" fill="#1f2328">ids</text>
  <g>
    <rect x="60" y="66" width="18" height="18" rx="2" fill="#e7ebf0" stroke="#8c959f" stroke-width="1"/>
    <rect x="80" y="66" width="18" height="18" rx="2" fill="#e7ebf0" stroke="#8c959f" stroke-width="1"/>
    <rect x="100" y="66" width="18" height="18" rx="2" fill="#e7ebf0" stroke="#8c959f" stroke-width="1"/>
    <rect x="120" y="66" width="18" height="18" rx="2" fill="#e7ebf0" stroke="#8c959f" stroke-width="1"/>
    <rect x="140" y="66" width="18" height="18" rx="2" fill="#e7ebf0" stroke="#8c959f" stroke-width="1"/>
    <rect x="160" y="66" width="18" height="18" rx="2" fill="#e7ebf0" stroke="#8c959f" stroke-width="1"/>
    <rect x="180" y="66" width="18" height="18" rx="2" fill="#e7ebf0" stroke="#8c959f" stroke-width="1"/>
    <rect x="200" y="66" width="18" height="18" rx="2" fill="#e7ebf0" stroke="#8c959f" stroke-width="1"/>
    <rect x="220" y="66" width="18" height="18" rx="2" fill="#e7ebf0" stroke="#8c959f" stroke-width="1"/>
    <rect x="242" y="66" width="18" height="18" rx="2" fill="#d7f0e0" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="262" y="66" width="18" height="18" rx="2" fill="#d7f0e0" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="282" y="66" width="18" height="18" rx="2" fill="#d7f0e0" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="302" y="66" width="18" height="18" rx="2" fill="#d7f0e0" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="322" y="66" width="18" height="18" rx="2" fill="#d7f0e0" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="342" y="66" width="18" height="18" rx="2" fill="#d7f0e0" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="362" y="66" width="18" height="18" rx="2" fill="#d7f0e0" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="382" y="66" width="18" height="18" rx="2" fill="#d7f0e0" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="402" y="66" width="18" height="18" rx="2" fill="#d7f0e0" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="422" y="66" width="18" height="18" rx="2" fill="#d7f0e0" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="442" y="66" width="18" height="18" rx="2" fill="#d7f0e0" stroke="#2f7d4f" stroke-width="1"/>
  </g>
  <text x="470" y="80" font-size="10.5" fill="#57606a">（示意：真实一条 204 token，prompt 41 / answer 164）</text>

  <!-- 分区标注 -->
  <line x1="60" y1="94" x2="238" y2="94" stroke="#8c959f" stroke-width="1.2"/>
  <text x="149" y="108" font-size="10.5" text-anchor="middle" fill="#57606a">prompt（用户给的，不用学）</text>
  <line x1="242" y1="94" x2="460" y2="94" stroke="#2f7d4f" stroke-width="1.2"/>
  <text x="351" y="108" font-size="10.5" text-anchor="middle" fill="#2f7d4f">answer（要学的，mask = 1）</text>

  <!-- x 行 -->
  <text x="20" y="140" font-size="11" font-weight="600" fill="#1f2328">x</text>
  <rect x="60" y="128" width="360" height="18" rx="2" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.2"/>
  <text x="240" y="142" font-size="10.5" text-anchor="middle" fill="#1f2328">ids[:-1]</text>
  <text x="430" y="142" font-size="10" fill="#57606a">长度 = L-1</text>

  <!-- y 行 -->
  <text x="20" y="166" font-size="11" font-weight="600" fill="#1f2328">y</text>
  <rect x="80" y="154" width="360" height="18" rx="2" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.2"/>
  <text x="260" y="168" font-size="10.5" text-anchor="middle" fill="#1f2328">ids[1:]</text>
  <text x="450" y="168" font-size="10" fill="#57606a">整体右移一位</text>

  <!-- mask 行 -->
  <text x="20" y="192" font-size="11" font-weight="600" fill="#1f2328">mask</text>
  <g>
    <rect x="80" y="180" width="18" height="18" rx="2" fill="#f0f0f0" stroke="#b0b7bf" stroke-width="1"/>
    <rect x="100" y="180" width="18" height="18" rx="2" fill="#f0f0f0" stroke="#b0b7bf" stroke-width="1"/>
    <rect x="120" y="180" width="18" height="18" rx="2" fill="#f0f0f0" stroke="#b0b7bf" stroke-width="1"/>
    <rect x="140" y="180" width="18" height="18" rx="2" fill="#f0f0f0" stroke="#b0b7bf" stroke-width="1"/>
    <rect x="160" y="180" width="18" height="18" rx="2" fill="#f0f0f0" stroke="#b0b7bf" stroke-width="1"/>
    <rect x="180" y="180" width="18" height="18" rx="2" fill="#f0f0f0" stroke="#b0b7bf" stroke-width="1"/>
    <rect x="200" y="180" width="18" height="18" rx="2" fill="#f0f0f0" stroke="#b0b7bf" stroke-width="1"/>
    <rect x="220" y="180" width="18" height="18" rx="2" fill="#f0f0f0" stroke="#b0b7bf" stroke-width="1"/>
    <rect x="242" y="180" width="18" height="18" rx="2" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="262" y="180" width="18" height="18" rx="2" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="282" y="180" width="18" height="18" rx="2" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="302" y="180" width="18" height="18" rx="2" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="322" y="180" width="18" height="18" rx="2" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="342" y="180" width="18" height="18" rx="2" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="362" y="180" width="18" height="18" rx="2" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="382" y="180" width="18" height="18" rx="2" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="402" y="180" width="18" height="18" rx="2" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="422" y="180" width="18" height="18" rx="2" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/>
    <rect x="440" y="180" width="18" height="18" rx="2" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#57606a">
    <text x="89" y="194">·</text>
    <text x="249" y="194" fill="#ffffff">1</text>
    <text x="289" y="194" fill="#ffffff">1</text>
    <text x="369" y="194" fill="#ffffff">1</text>
  </g>
  <text x="470" y="194" font-size="10.5" fill="#57606a">· = 梯度恒为 0（实测被 mask 掉 1,998 个 prompt token）</text>

  <!-- 对照实验 -->
  <line x1="20" y1="220" x2="660" y2="220" stroke="#d0d7de" stroke-width="1"/>
  <text x="20" y="240" font-size="12.5" font-weight="600" fill="#1f2328">对照实验（各训 60 步，其余完全相同）：A 只算答案区 / B 全序列都算</text>

  <!-- 答案区 -->
  <text x="20" y="266" font-size="11" fill="#1f2328">答案区困惑度</text>
  <rect x="120" y="254" width="90" height="16" rx="3" fill="#f0f0f0" stroke="#b0b7bf"/>
  <text x="126" y="266" font-size="10" fill="#57606a">微调前 3,649.9</text>
  <rect x="120" y="276" width="14" height="14" rx="3" fill="#2f7d4f"/>
  <text x="140" y="287" font-size="10.5" fill="#1f2328">A 组 426.2　→ 我们要的指标，A 更好</text>
  <rect x="120" y="296" width="16" height="14" rx="3" fill="#c0392b"/>
  <text x="140" y="307" font-size="10.5" fill="#1f2328">B 组 454.5　→ B 相对 A 差 +6.64%</text>

  <!-- prompt 区 -->
  <text x="370" y="266" font-size="11" fill="#1f2328">prompt 区困惑度</text>
  <rect x="470" y="254" width="90" height="16" rx="3" fill="#f0f0f0" stroke="#b0b7bf"/>
  <text x="476" y="266" font-size="10" fill="#57606a">微调前 2,204.2</text>
  <rect x="470" y="276" width="100" height="14" rx="3" fill="#c0392b"/>
  <text x="490" y="287" font-size="10.5" fill="#1f2328">A 组 1,184.9</text>
  <rect x="470" y="296" width="10" height="14" rx="3" fill="#2f7d4f"/>
  <text x="490" y="307" font-size="10.5" fill="#1f2328">B 组 119.9　→ B 相对 A −89.88%，但那是"背问题"</text>

  <rect x="20" y="322" width="640" height="30" rx="6" fill="#fff8e6" stroke="#bf8700" stroke-width="1.3"/>
  <text x="34" y="341" font-size="10.5" fill="#8a6100">读法：B 组把一部分梯度拿去拟合 prompt —— 它确实更会背问题，但答案区反而差 6.64%。答案区才是要优化的目标。</text>
  <text x="20" y="357" font-size="9.5" fill="#57606a">mask 覆盖 81.41%（单条平均 81.31%）；59 条 / 60 步规模下差距不算夸张，但方向稳定，步数越多差距越明显。</text>
</svg>
