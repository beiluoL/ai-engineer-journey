<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">M07 Checkpoint：存 → 取 → 续训，loss 曲线能不能接上</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">A 一次性 100 步（基准）　B 真续训（含训练状态）　C 假续训（只加载权重）　实测逐点最大差 1.290e-04 vs 3.173e-01</text>

  <!-- 主流程 -->
  <rect x="20" y="70" width="106" height="46" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.6"/>
  <text x="73" y="90" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">训 50 步</text>
  <text x="73" y="106" font-size="10" text-anchor="middle" fill="#57606a">loss 6.1469</text>

  <rect x="146" y="70" width="118" height="46" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.6"/>
  <text x="205" y="90" font-size="11.5" font-weight="600" text-anchor="middle" fill="#8a6100">save_checkpoint</text>
  <text x="205" y="106" font-size="10" text-anchor="middle" fill="#57606a">31.4 ms（fp64→fp32）</text>

  <rect x="284" y="70" width="112" height="46" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="340" y="90" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">.npz + .json</text>
  <text x="340" y="106" font-size="10" text-anchor="middle" fill="#57606a">115.76 KB / 341.68 KB</text>

  <rect x="416" y="70" width="118" height="46" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.6"/>
  <text x="475" y="90" font-size="11.5" font-weight="600" text-anchor="middle" fill="#8a6100">load_checkpoint</text>
  <text x="475" y="106" font-size="10" text-anchor="middle" fill="#57606a">16.2 ms（就地写 A.data[:]）</text>

  <rect x="554" y="70" width="106" height="46" rx="8" fill="#eaf6ec" stroke="#2f7d4f" stroke-width="1.6"/>
  <text x="607" y="90" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">再训 50 步</text>
  <text x="607" y="106" font-size="10" text-anchor="middle" fill="#57606a">loss 6.1531</text>

  <g stroke="#57606a" stroke-width="1.7" fill="none" marker-end="url(#arrow)">
    <line x1="126" y1="93" x2="142" y2="93"/>
    <line x1="264" y1="93" x2="280" y2="93"/>
    <line x1="396" y1="93" x2="412" y2="93"/>
    <line x1="534" y1="93" x2="550" y2="93"/>
  </g>

  <!-- 文件结构 -->
  <rect x="20" y="134" width="640" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <text x="34" y="153" font-size="11.5" font-weight="600" fill="#1f2328">落盘内容（26 个 A/B + 52 个动量 = 78 个数组）</text>
  <g font-size="10" fill="#57606a">
    <text x="34" y="171">npz　A::&lt;path&gt; / B::&lt;path&gt;　（仅权重 → 115.76 KB，占基座 fp32 的 12.85%）</text>
    <text x="34" y="186">　　 opt_m::i / opt_v::i　（Adam 一/二阶动量 → 含状态共 341.68 KB，37.92%）</text>
    <text x="34" y="200">json　format / 每层 r·alpha·scaling / optimizer{name, lr, step, t} / losses 曲线</text>
  </g>
  <text x="380" y="171" font-size="10" fill="#2f7d4f">基座 fp32：1,007.00 KB → 基座/adapter = 8.70×</text>
  <text x="380" y="186" font-size="10" fill="#57606a">⚠ 加载必须就地写 A.data[:]，不能换 Parameter 对象（P06 的 Adam 按 id(p) 建 state）</text>
  <text x="380" y="200" font-size="10" fill="#57606a">往返一致性：fp32 7.449e-09 ／ fp64 0.000e+00（逐位一致）</text>

  <!-- 三组对比 -->
  <text x="20" y="232" font-size="12.5" font-weight="600" fill="#1f2328">三组对照（后 50 步均值 / 终点 loss / 与 A 逐点最大差）</text>

  <rect x="20" y="242" width="200" height="52" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
  <text x="32" y="260" font-size="10.5" font-weight="600" fill="#1f2328">A 一次性 100 步（基准）</text>
  <text x="32" y="275" font-size="10" fill="#57606a">后50步 6.0828　终点 6.1531</text>
  <text x="32" y="288" font-size="10" fill="#57606a">逐点差 0（基准）</text>

  <rect x="232" y="242" width="212" height="52" rx="6" fill="#eaf6ec" stroke="#2f7d4f" stroke-width="1.6"/>
  <text x="244" y="260" font-size="10.5" font-weight="600" fill="#2f7d4f">B 真续训（含训练状态）✅ 曲线连续</text>
  <text x="244" y="275" font-size="10" fill="#57606a">后50步 6.0828　终点 6.1531　step/t = 50/50</text>
  <text x="244" y="288" font-size="10" fill="#2f7d4f">与 A 逐点最大差 1.290e-04　断点跳变 0.1981（与 A 完全相同）</text>

  <rect x="456" y="242" width="204" height="52" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.6"/>
  <text x="468" y="260" font-size="10.5" font-weight="600" fill="#c0392b">C 假续训（丢训练状态）❌</text>
  <text x="468" y="275" font-size="10" fill="#57606a">后50步 6.0432　终点 6.1370　step/t = 0/0</text>
  <text x="468" y="288" font-size="10" fill="#c0392b">与 A 逐点最大差 3.173e-01（≈ 2500 倍于 B）</text>

  <!-- P06 Adam 坑 -->
  <rect x="20" y="306" width="640" height="46" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.4"/>
  <text x="34" y="325" font-size="10.5" font-weight="600" fill="#8a6100">⚠ 实测发现：P06 的 Adam 动量从未累积 —— 训 30 步后 state 里非零元素 0 / 54,272</text>
  <text x="34" y="340" font-size="10" fill="#57606a">原因：Adam.step() 里 m/v 是局部变量，没写回 self.state。后果：断点真正需要恢复的只有步数 t（它参与偏置修正）。</text>
  <text x="34" y="350" font-size="10" fill="#57606a">本项目不改 P06，照实记录；m/v 仍然落盘 —— 换成正确实现后这份 checkpoint 可以直接用。</text>
</svg>
