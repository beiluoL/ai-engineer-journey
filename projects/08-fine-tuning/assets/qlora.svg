<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7fd4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">M05 NF4 量化 / 反量化：分块 absmax → 查不等距码本 → 4-bit 码字</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">权重近似正态分布 → 按分位数切 16 份，让每个桶落进同样多的权重。实测相对误差 0.0914。</text>

  <!-- 量化链 -->
  <rect x="20" y="72" width="96" height="48" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.6"/>
  <text x="68" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">W（fp32）</text>
  <text x="68" y="108" font-size="10" text-anchor="middle" fill="#57606a">按 64 个分块</text>

  <rect x="134" y="72" width="96" height="48" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="182" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">÷ absmax</text>
  <text x="182" y="108" font-size="10" text-anchor="middle" fill="#57606a">组内绝对值最大</text>

  <rect x="248" y="72" width="118" height="48" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="307" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">最近邻查码本</text>
  <text x="307" y="108" font-size="10" text-anchor="middle" fill="#57606a">argmin|x − c|，非 round</text>

  <rect x="384" y="72" width="104" height="48" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.6"/>
  <text x="436" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#8a6100">4-bit codes</text>
  <text x="436" y="108" font-size="10" text-anchor="middle" fill="#57606a">0.5 B / 权重</text>

  <rect x="506" y="72" width="104" height="48" rx="8" fill="#eaf6ec" stroke="#2f7d4f" stroke-width="1.6"/>
  <text x="558" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">× absmax → Ŵ</text>
  <text x="558" y="108" font-size="10" text-anchor="middle" fill="#57606a">反量化（有损）</text>

  <g stroke="#57606a" stroke-width="1.7" fill="none" marker-end="url(#arrow)">
    <line x1="116" y1="96" x2="130" y2="96"/>
    <line x1="230" y1="96" x2="244" y2="96"/>
    <line x1="366" y1="96" x2="380" y2="96"/>
    <line x1="488" y1="96" x2="502" y2="96"/>
  </g>
  <path d="M558 120 C 558 140, 68 140, 68 122" fill="none" stroke="#2f7d4f" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <text x="230" y="150" font-size="10" fill="#57606a">误差实测：平均相对误差 ‖W−Ŵ‖/‖W‖ = 0.0914，MSE 8.267e-06，单层最大绝对误差 0.024068</text>

  <!-- 码本 -->
  <rect x="20" y="164" width="330" height="98" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <text x="34" y="184" font-size="11.5" font-weight="600" fill="#1f2328">NF4 码本（16 个值，不是等距的）</text>
  <g font-size="9.5" fill="#57606a">
    <text x="34" y="202">−1.0000</text>
    <text x="96" y="202">−0.6962</text>
    <text x="158" y="202">−0.5251</text>
    <text x="220" y="202">−0.3949</text>
    <text x="282" y="202">−0.2844</text>
    <text x="34" y="218">−0.1848</text>
    <text x="96" y="218">−0.0911</text>
    <text x="158" y="218">+0.0000</text>
    <text x="220" y="218">+0.0796</text>
    <text x="282" y="218">+0.1609</text>
    <text x="34" y="234">+0.2461</text>
    <text x="96" y="234">+0.3379</text>
    <text x="158" y="234">+0.4407</text>
    <text x="220" y="234">+0.5626</text>
    <text x="282" y="234">+0.7230</text>
    <text x="34" y="250">+1.0000</text>
  </g>
  <text x="120" y="250" font-size="9.5" fill="#57606a">间距 最小 0.0796 / 最大 0.3038　中间密两头疏</text>
  <text x="230" y="250" font-size="9.5" fill="#2f7d4f">零在码本里 ✓</text>

  <!-- 双量化 -->
  <rect x="366" y="164" width="294" height="98" rx="8" fill="#ffffff" stroke="#bf8700" stroke-width="1.3"/>
  <text x="380" y="184" font-size="11.5" font-weight="600" fill="#8a6100">双量化：把 absmax 自己也压成 8 bit</text>
  <g font-size="10" fill="#57606a">
    <text x="380" y="204">fp32 原始　　655,360 B　4.0000 B/权重　1.00×　误差 0.0000</text>
    <text x="380" y="220">NF4 单量化　　92,160 B　0.5625 B/权重　7.11×　误差 0.0914</text>
    <text x="380" y="236">NF4 + 双量化　 84,520 B　0.5159 B/权重　7.75×　误差 0.0915</text>
  </g>
  <text x="380" y="254" font-size="10" fill="#2f7d4f">额外省 7,640 B（8.29%），误差代价仅 +0.1012%　→ 划算</text>

  <!-- 显存账本 -->
  <text x="20" y="288" font-size="12" font-weight="600" fill="#1f2328">显存账本（13 层 / 163,840 个权重，实测字节）</text>
  <g>
    <rect x="20" y="296" width="300" height="13" rx="3" fill="#4a7fd4"/>
    <text x="326" y="307" font-size="10" fill="#57606a">fp32 基座 640.00 KB（100%）</text>
    <rect x="20" y="313" width="150" height="13" rx="3" fill="#8c959f"/>
    <text x="176" y="324" font-size="10" fill="#57606a">fp16 320.00 KB（50%）</text>
    <rect x="20" y="330" width="42" height="13" rx="3" fill="#2f7d4f"/>
    <text x="68" y="341" font-size="10" fill="#57606a">NF4 90.00 KB（14.06%）　NF4+双量化 82.54 KB（12.90%）</text>
  </g>

  <!-- 反直觉 -->
  <rect x="380" y="288" width="280" height="56" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.4"/>
  <text x="394" y="307" font-size="10.5" font-weight="600" fill="#c0392b">⚠ 小模型上 QLoRA 不划算（实测）</text>
  <text x="394" y="322" font-size="10" fill="#57606a">adapter 106.00 KB &gt; NF4 基座 82.54 KB = 128.42%</text>
  <text x="394" y="336" font-size="10" fill="#57606a">量化收益随规模线性增长：7B 上才是 0.66 MB vs 3.5 GB（按同一公式外推）</text>
</svg>
