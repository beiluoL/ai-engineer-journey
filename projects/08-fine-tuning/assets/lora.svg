<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">M04 LoRA 结构：冻结基座 + 旁路 (alpha/r)·A@B</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">W' = W + ΔW = W + (alpha/r)·A@B（P06 右乘约定：A[in,r] @ B[r,out]）。以 FFN 的 W1（64 → 256）为例。</text>

  <!-- 输入 x -->
  <rect x="20" y="150" width="72" height="46" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.6"/>
  <text x="56" y="170" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">x</text>
  <text x="56" y="187" font-size="10" text-anchor="middle" fill="#57606a">(B, 64)</text>

  <!-- 分叉 -->
  <path d="M92 162 C 120 162, 120 108, 148 108" fill="none" stroke="#57606a" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M92 182 C 120 182, 120 258, 148 258" fill="none" stroke="#2f7d4f" stroke-width="1.7" marker-end="url(#arrow-green)"/>

  <!-- 基座 W -->
  <rect x="152" y="84" width="126" height="50" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.8"/>
  <text x="215" y="104" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">W（冻结）</text>
  <text x="215" y="120" font-size="10" text-anchor="middle" fill="#57606a">64×256 = 16,384</text>
  <text x="215" y="132" font-size="9.5" text-anchor="middle" fill="#4a7fd4">requires_grad = False</text>

  <!-- A -->
  <rect x="152" y="236" width="82" height="46" rx="8" fill="#eaf6ec" stroke="#2f7d4f" stroke-width="1.8"/>
  <text x="193" y="256" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">A</text>
  <text x="193" y="272" font-size="10" text-anchor="middle" fill="#57606a">64×8 = 512</text>

  <!-- B -->
  <rect x="250" y="236" width="86" height="46" rx="8" fill="#eaf6ec" stroke="#2f7d4f" stroke-width="1.8"/>
  <text x="293" y="256" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">B</text>
  <text x="293" y="272" font-size="10" text-anchor="middle" fill="#57606a">8×256 = 2,048</text>

  <!-- 缩放 -->
  <rect x="352" y="236" width="74" height="46" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.6"/>
  <text x="389" y="256" font-size="12" font-weight="600" text-anchor="middle" fill="#8a6100">× alpha/r</text>
  <text x="389" y="272" font-size="10" text-anchor="middle" fill="#57606a">16/8 = 2</text>

  <line x1="234" y1="259" x2="246" y2="259" stroke="#2f7d4f" stroke-width="1.7" marker-end="url(#arrow-green)"/>
  <line x1="336" y1="259" x2="348" y2="259" stroke="#2f7d4f" stroke-width="1.7" marker-end="url(#arrow-green)"/>

  <!-- 求和 -->
  <circle cx="486" cy="172" r="20" fill="#ffffff" stroke="#57606a" stroke-width="1.8"/>
  <text x="486" y="178" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">+</text>
  <path d="M278 109 C 400 109, 460 140, 468 162" fill="none" stroke="#57606a" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M426 259 C 460 259, 470 210, 474 190" fill="none" stroke="#2f7d4f" stroke-width="1.7" marker-end="url(#arrow-green)"/>

  <!-- 输出 -->
  <rect x="530" y="150" width="110" height="46" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="585" y="170" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">y = x·(W+ΔW)</text>
  <text x="585" y="187" font-size="10" text-anchor="middle" fill="#57606a">(B, 256)</text>
  <line x1="506" y1="172" x2="526" y2="172" stroke="#57606a" stroke-width="1.7" marker-end="url(#arrow)"/>

  <!-- 初始化说明 -->
  <rect x="152" y="300" width="212" height="46" rx="6" fill="#ffffff" stroke="#2f7d4f" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="164" y="317" font-size="10.5" font-weight="600" fill="#2f7d4f">初始化：A ~ U(−1/√in, 1/√in)，B = 全零</text>
  <text x="164" y="332" font-size="10" fill="#57606a">实测 A ∈ [−0.1249, +0.1243]，max|B| = 0</text>
  <text x="164" y="343" font-size="10" fill="#57606a">→ ΔW ≡ 0，注入前后输出逐位相同（0.000e+00）</text>

  <!-- 反向说明 -->
  <rect x="384" y="300" width="276" height="46" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="396" y="317" font-size="10.5" font-weight="600" fill="#1f2328">反向：把落在合并权重上的梯度拆回 A / B</text>
  <text x="396" y="332" font-size="10" fill="#57606a">∂L/∂A = s·G@Bᵀ　　∂L/∂B = s·Aᵀ@G　　(s = alpha/r)</text>
  <text x="396" y="343" font-size="10" fill="#57606a">冻结的 W 不在计算图里，也不该被优化器看到</text>

  <!-- 顶部标注 -->
  <text x="20" y="72" font-size="11" font-weight="600" fill="#1f2328">本层参数量：基座 16,384 → 可训练 2,560 = 15.62%</text>
  <text x="300" y="72" font-size="10.5" fill="#57606a">整机：基座 230,656 + adapter 27,136 = 257,792（可训练 10.53%）</text>
  <text x="20" y="88" font-size="10.5" fill="#c0392b">⚠ 坑：Tensor.__init__ 把 _backward 设成实例属性，会遮蔽同名方法 → 必须显式 self._backward = self._lora_backward</text>
</svg>
