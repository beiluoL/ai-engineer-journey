<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">M09 训练循环：从零 autograd 反传 + 梯度校验</text>
  <text x="20" y="48" font-size="11.5" fill="#57606a">X → 模型 → logits → cross_entropy(mask) → loss → backward → 优化器 step → 更新参数。</text>

  <!-- X -->
  <rect x="20" y="150" width="70" height="50" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="55" y="173" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">X</text>
  <text x="55" y="189" font-size="10" text-anchor="middle" fill="#57606a">+ mask</text>

  <!-- model -->
  <rect x="120" y="150" width="110" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="175" y="172" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">TransformerLM</text>
  <text x="175" y="188" font-size="10" text-anchor="middle" fill="#57606a">前向（M03-07）</text>

  <!-- logits -->
  <rect x="260" y="150" width="80" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="300" y="173" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">logits</text>
  <text x="300" y="189" font-size="10" text-anchor="middle" fill="#57606a">(seq,V)</text>

  <!-- cross entropy -->
  <rect x="370" y="150" width="110" height="50" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="425" y="172" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">cross_entropy</text>
  <text x="425" y="188" font-size="10" text-anchor="middle" fill="#57606a">mask 排除 pad</text>

  <!-- loss -->
  <rect x="510" y="150" width="80" height="50" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="550" y="173" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">loss</text>
  <text x="550" y="189" font-size="10" text-anchor="middle" fill="#57606a">标量</text>

  <!-- backward -->
  <rect x="510" y="240" width="80" height="45" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="550" y="266" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">backward</text>

  <!-- optimizer -->
  <rect x="370" y="240" width="110" height="45" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="425" y="263" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Adam / SGD</text>
  <text x="425" y="278" font-size="10" text-anchor="middle" fill="#57606a">step</text>

  <!-- params -->
  <rect x="120" y="240" width="110" height="45" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="175" y="263" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">参数 Parameter</text>
  <text x="175" y="278" font-size="10" text-anchor="middle" fill="#57606a">23,168 个</text>

  <!-- grad check -->
  <rect x="20" y="240" width="80" height="45" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="60" y="262" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">grad_check</text>
  <text x="60" y="277" font-size="9.5" text-anchor="middle" fill="#57606a">有限差分对拍</text>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="90" y1="175" x2="116" y2="175"/>
    <line x1="230" y1="175" x2="256" y2="175"/>
    <line x1="340" y1="175" x2="366" y2="175"/>
    <line x1="480" y1="175" x2="506" y2="175"/>
    <line x1="550" y1="200" x2="550" y2="238"/>
    <line x1="510" y1="262" x2="480" y2="240"/>
    <line x1="370" y1="262" x2="230" y2="240"/>
  </g>
  <path d="M110 285 C 110 305, 60 285, 100 285" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <text x="550" y="205" font-size="9.5" fill="#57606a">拓扑排序链式求导</text>
  <text x="20" y="312" font-size="10.5" fill="#57606a">demo 实测：loss 6.2100→4.7472（≈log V=6.2146）；梯度校验最大相对误差 2.60e-05 &lt; 1e-3。</text>
</svg>
