<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">M10 推理采样：一个 token 一个 token 地生成</text>
  <text x="20" y="48" font-size="11.5" fill="#57606a">prompt → encode → 取最后一位 logits → 按策略采样 → 拼回 → 遇 &lt;eos&gt; 停。长度线性增长。</text>

  <!-- prompt -->
  <rect x="20" y="150" width="90" height="50" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="65" y="173" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">prompt</text>
  <text x="65" y="189" font-size="10" text-anchor="middle" fill="#57606a">str</text>

  <!-- encode -->
  <rect x="140" y="150" width="90" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="185" y="173" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">encode</text>
  <text x="185" y="189" font-size="10" text-anchor="middle" fill="#57606a">→ ids</text>

  <!-- model last logits -->
  <rect x="260" y="150" width="130" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="325" y="172" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">model(logits)</text>
  <text x="325" y="188" font-size="10" text-anchor="middle" fill="#57606a">取最后一位 (V,)</text>

  <!-- sample policy -->
  <rect x="420" y="150" width="130" height="50" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="485" y="170" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">采样策略</text>
  <text x="485" y="186" font-size="9.5" text-anchor="middle" fill="#57606a">greedy / temp / top-k</text>

  <!-- next token -->
  <rect x="580" y="150" width="80" height="50" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="620" y="173" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">next</text>
  <text x="620" y="189" font-size="10" text-anchor="middle" fill="#57606a">token</text>

  <!-- loop back -->
  <rect x="260" y="245" width="240" height="45" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="380" y="263" font-size="11" text-anchor="middle" fill="#57606a">拼回序列；若 ==&lt;eos&gt; 则停</text>
  <text x="380" y="280" font-size="10" text-anchor="middle" fill="#57606a">否则继续循环（最多 max_new_tokens）</text>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="110" y1="175" x2="136" y2="175"/>
    <line x1="230" y1="175" x2="256" y2="175"/>
    <line x1="390" y1="175" x2="416" y2="175"/>
    <line x1="550" y1="175" x2="576" y2="175"/>
    <line x1="620" y1="200" x2="620" y2="243"/>
    <line x1="500" y1="267" x2="400" y2="267"/>
    <path d="M340 290 C 340 310, 300 290, 260 290" fill="none" stroke="#57606a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  </g>
  <text x="20" y="312" font-size="10.5" fill="#57606a">demo 实测：prompt 'Transformer' 贪心续出空格；temp=0.5 聚焦、1.2 发散；top_k=20 截掉长尾噪声。</text>
</svg>
