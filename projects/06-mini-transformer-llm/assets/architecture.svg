<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>

  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2328">Project 06 模块依赖图：Tokenizer → Embedding → Transformer Block → Training → Inference</text>
  <text x="20" y="52" font-size="12" fill="#57606a">实线 = 数据从前向后流；虚线 = 训练把梯度/权重回写给参数层（唯一一条反向依赖）</text>

  <!-- 主干：五个模块 -->
  <g>
    <rect x="20" y="120" width="120" height="70" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
    <text x="80" y="150" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">语料 Corpus</text>
    <text x="80" y="171" font-size="11" text-anchor="middle" fill="#57606a">raw text</text>

    <rect x="180" y="120" width="160" height="70" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="260" y="146" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Tokenizer</text>
    <text x="260" y="165" font-size="11" text-anchor="middle" fill="#57606a">M01-M02 · char / BPE</text>
    <text x="260" y="181" font-size="11" text-anchor="middle" fill="#57606a">vocab_size = V</text>

    <rect x="380" y="120" width="150" height="70" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="455" y="146" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Embedding</text>
    <text x="455" y="165" font-size="11" text-anchor="middle" fill="#57606a">M03 · 查表 + 位置编码</text>
    <text x="455" y="181" font-size="11" text-anchor="middle" fill="#57606a">参数 (V, d_model)</text>

    <rect x="570" y="120" width="180" height="70" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="660" y="146" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Transformer Block</text>
    <text x="660" y="165" font-size="11" text-anchor="middle" fill="#57606a">M04-M07 · Attention+FFN</text>
    <text x="660" y="181" font-size="11" text-anchor="middle" fill="#57606a">× N 层堆叠</text>

    <rect x="790" y="120" width="90" height="70" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
    <text x="835" y="150" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Inference</text>
    <text x="835" y="171" font-size="11" text-anchor="middle" fill="#57606a">M10 · 采样</text>
  </g>

  <!-- 主干箭头 + 契约标注 -->
  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="155" x2="176" y2="155"/>
    <line x1="340" y1="155" x2="376" y2="155"/>
    <line x1="530" y1="155" x2="566" y2="155"/>
    <line x1="750" y1="155" x2="786" y2="155"/>
  </g>
  <g font-size="11.5" fill="#0969da" text-anchor="middle">
    <text x="158" y="106">str</text>
    <text x="358" y="106">ids: list[int]</text>
    <text x="548" y="106">x: (n, d_model)</text>
    <text x="768" y="106">logits</text>
  </g>
  <text x="768" y="118" font-size="10" fill="#57606a" text-anchor="middle">(n, V)</text>

  <!-- Training -->
  <rect x="340" y="272" width="230" height="70" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="455" y="298" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Training 训练循环</text>
  <text x="455" y="317" font-size="11" text-anchor="middle" fill="#57606a">M08-M09 · 自回归 + 交叉熵</text>
  <text x="455" y="333" font-size="11" text-anchor="middle" fill="#57606a">输入 ids 与 logits，输出权重</text>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <polyline points="260,190 260,307 336,307"/>
    <polyline points="620,190 620,307 574,307"/>
  </g>
  <text x="286" y="300" font-size="11" fill="#57606a">ids</text>
  <text x="628" y="300" font-size="11" fill="#57606a">logits + loss</text>

  <!-- 虚线：权重回写 -->
  <g stroke="#9a6700" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow-dash)">
    <polyline points="430,272 430,236"/>
    <line x1="430" y1="236" x2="620" y2="236"/>
    <line x1="430" y1="236" x2="390" y2="236"/>
    <line x1="390" y1="236" x2="390" y2="194"/>
    <line x1="620" y1="236" x2="620" y2="194"/>
  </g>
  <text x="492" y="230" font-size="11" fill="#9a6700">更新权重（梯度回写，唯一反向依赖）</text>

  <text x="20" y="368" font-size="11" fill="#57606a">契约写死在箭头上方：下游只认形状与类型，不认上游实现 —— 换分词器不用改 Transformer 一行代码。</text>
</svg>
