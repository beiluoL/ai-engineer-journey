<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">M07 DecoderStack → logits：整条前向闭环</text>
  <text x="20" y="48" font-size="11.5" fill="#57606a">ids → Embedding → [Block × N] → Final LN → 投影 → logits(seq, V)。TransformerLM 把 Embedding+Decoder 缝成整机。</text>

  <!-- ids -->
  <rect x="20" y="150" width="80" height="50" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="60" y="173" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">ids</text>
  <text x="60" y="189" font-size="10.5" text-anchor="middle" fill="#57606a">(B, seq)</text>

  <!-- embedding combine -->
  <rect x="130" y="150" width="120" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="190" y="172" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">combine</text>
  <text x="190" y="188" font-size="10.5" text-anchor="middle" fill="#57606a">Emb + PosEnc</text>

  <!-- Block N -->
  <rect x="280" y="150" width="120" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="340" y="172" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">Block × N</text>
  <text x="340" y="188" font-size="10.5" text-anchor="middle" fill="#57606a">堆叠 n_layers</text>

  <!-- final LN -->
  <rect x="430" y="150" width="80" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="470" y="173" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">LN_f</text>
  <text x="470" y="189" font-size="10" text-anchor="middle" fill="#57606a">γ,β</text>

  <!-- proj -->
  <rect x="540" y="150" width="110" height="50" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="595" y="172" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">proj</text>
  <text x="595" y="188" font-size="10.5" text-anchor="middle" fill="#57606a">d_model→V</text>

  <!-- logits -->
  <rect x="510" y="240" width="120" height="50" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="570" y="262" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">logits</text>
  <text x="570" y="278" font-size="10.5" text-anchor="middle" fill="#57606a">(seq, vocab)</text>

  <!-- TransformerLM wrapper -->
  <rect x="110" y="60" width="460" height="200" rx="14" fill="none" stroke="#bbb" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="125" y="80" font-size="12" font-weight="600" fill="#57606a">TransformerLM（整机）</text>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="100" y1="175" x2="126" y2="175"/>
    <line x1="250" y1="175" x2="276" y2="175"/>
    <line x1="400" y1="175" x2="426" y2="175"/>
    <line x1="510" y1="175" x2="536" y2="175"/>
    <line x1="650" y1="175" x2="650" y2="240"/>
    <line x1="570" y1="240" x2="570" y2="240" stroke="none"/>
    <path d="M595 200 C 595 230, 580 240, 570 240" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>
  <text x="20" y="312" font-size="10.5" fill="#57606a">demo 实测：vocab=500,d_model=24,n_heads=4,d_ff=64,n_layers=2；logits (1,12,500)；n_layers=1 或 3 接口形状不变。</text>
</svg>
