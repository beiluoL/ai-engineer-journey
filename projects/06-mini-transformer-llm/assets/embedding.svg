<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">M03 Embedding：id → 向量 + 位置指纹</text>
  <text x="20" y="48" font-size="11.5" fill="#57606a">纯 numpy。查表用 one-hot(id) @ W_e，位置编码是固定正弦函数（不进参数表）。</text>

  <!-- ids -->
  <rect x="20" y="150" width="90" height="60" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="65" y="176" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">ids</text>
  <text x="65" y="196" font-size="11" text-anchor="middle" fill="#57606a">(n,)</text>

  <!-- one-hot -->
  <rect x="150" y="150" width="100" height="60" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="200" y="176" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">one-hot</text>
  <text x="200" y="196" font-size="11" text-anchor="middle" fill="#57606a">(n, V)</text>

  <!-- W_e -->
  <rect x="290" y="95" width="110" height="50" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="345" y="116" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">W_e</text>
  <text x="345" y="134" font-size="11" text-anchor="middle" fill="#57606a">Parameter (V, d_model)</text>

  <!-- matmul -->
  <text x="270" y="183" font-size="12" text-anchor="middle" fill="#57606a">@</text>

  <!-- token emb -->
  <rect x="440" y="150" width="120" height="60" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="500" y="176" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">token_emb</text>
  <text x="500" y="196" font-size="11" text-anchor="middle" fill="#57606a">(n, d_model)</text>

  <!-- pos enc -->
  <rect x="290" y="225" width="130" height="50" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="355" y="246" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">PositionalEnc</text>
  <text x="355" y="264" font-size="11" text-anchor="middle" fill="#57606a">固定 (n, d_model)</text>

  <!-- combine add -->
  <circle cx="610" cy="180" r="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="610" y="185" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">+</text>

  <!-- x out -->
  <rect x="600" y="240" width="65" height="55" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="632" y="263" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">x</text>
  <text x="632" y="281" font-size="11" text-anchor="middle" fill="#57606a">(n, d)</text>

  <!-- arrows -->
  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="110" y1="180" x2="146" y2="180"/>
    <line x1="250" y1="180" x2="436" y2="180"/>
    <line x1="400" y1="145" x2="380" y2="120"/>
    <line x1="420" y1="250" x2="448" y2="200"/>
    <line x1="560" y1="180" x2="586" y2="180"/>
    <line x1="632" y1="222" x2="632" y2="240"/>
  </g>
  <text x="345" y="90" font-size="11" fill="#57606a" text-anchor="middle">小初始化 0.02，免 softmax 饱和</text>
  <text x="500" y="270" font-size="11" fill="#57606a">token + pos（广播到 batch）</text>
  <text x="20" y="300" font-size="11" fill="#57606a">demo 实测：W_e (500,16)；combine == token + pos : True；批处理 (B,T,16)。</text>
</svg>
