<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">M04 缩放点积注意力 + 因果掩码</text>
  <text x="20" y="48" font-size="11.5" fill="#57606a">scores = QKᵀ/√d_k → + mask → softmax → ·V。解码器只能看 0..i，未来位压成 0。</text>

  <!-- Q K V -->
  <rect x="20" y="150" width="70" height="55" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="55" y="174" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Q</text>
  <text x="55" y="192" font-size="10.5" text-anchor="middle" fill="#57606a">(seq,d_k)</text>
  <rect x="20" y="220" width="70" height="55" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="55" y="244" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">K</text>
  <text x="55" y="262" font-size="10.5" text-anchor="middle" fill="#57606a">(seq,d_k)</text>
  <rect x="110" y="150" width="70" height="55" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="145" y="174" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">V</text>
  <text x="145" y="192" font-size="10.5" text-anchor="middle" fill="#57606a">(seq,d_k)</text>

  <!-- matmul QK^T -->
  <rect x="210" y="150" width="120" height="55" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="270" y="174" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">QKᵀ</text>
  <text x="270" y="192" font-size="10.5" text-anchor="middle" fill="#57606a">matmul → (seq,seq)</text>

  <!-- scale -->
  <rect x="360" y="80" width="100" height="45" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="410" y="102" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">÷ √d_k</text>
  <text x="410" y="118" font-size="10.5" text-anchor="middle" fill="#57606a">防 softmax 饱和</text>

  <!-- causal mask -->
  <rect x="350" y="225" width="120" height="55" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="410" y="247" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">causal_mask</text>
  <text x="410" y="263" font-size="10.5" text-anchor="middle" fill="#57606a">上三角 -inf</text>
  <text x="410" y="277" font-size="9.5" text-anchor="middle" fill="#57606a">下三角 = 0</text>

  <!-- + -->
  <circle cx="510" cy="160" r="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="510" y="166" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">+</text>

  <!-- softmax -->
  <rect x="560" y="110" width="100" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="610" y="132" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">softmax</text>
  <text x="610" y="148" font-size="10.5" text-anchor="middle" fill="#57606a">每行和=1</text>

  <!-- attn -->
  <rect x="560" y="190" width="100" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="610" y="212" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">attn</text>
  <text x="610" y="228" font-size="10.5" text-anchor="middle" fill="#57606a">(seq,seq)</text>

  <!-- out -->
  <rect x="520" y="270" width="120" height="50" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="580" y="292" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">out = attn·V</text>
  <text x="580" y="308" font-size="10.5" text-anchor="middle" fill="#57606a">(seq,d_k)</text>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="90" y1="177" x2="206" y2="177"/>
    <line x1="90" y1="247" x2="206" y2="183"/>
    <line x1="180" y1="177" x2="206" y2="177"/>
    <line x1="330" y1="177" x2="356" y2="122"/>
    <line x1="330" y1="177" x2="348" y2="240"/>
    <line x1="470" y1="107" x2="556" y2="128"/>
    <line x1="530" y1="160" x2="556" y2="160"/>
    <line x1="660" y1="160" x2="660" y2="186"/>
    <line x1="660" y1="240" x2="660" y2="262"/>
    <line x1="610" y1="240" x2="610" y2="266"/>
    <line x1="560" y1="295" x2="520" y2="280"/>
  </g>
  <text x="20" y="312" font-size="10.5" fill="#57606a">demo 实测：|max| scores 7.055 → 缩放后 2.494；加掩码后上三角权重 ≤ 0。V 在第 0 行只能看自己。</text>
</svg>
