<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">M08 DataLoader：自回归滑窗 + 批处理补齐</text>
  <text x="20" y="48" font-size="11.5" fill="#57606a">用前 L 个 token 预测第 L+1 个；变长样本按 batch 内最长右侧 pad，仅对真实位算 loss。</text>

  <!-- corpus lines -->
  <rect x="20" y="150" width="100" height="55" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="70" y="174" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">语料(多行)</text>
  <text x="70" y="192" font-size="10.5" text-anchor="middle" fill="#57606a">每行变长</text>

  <!-- sliding window -->
  <rect x="150" y="150" width="120" height="55" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="210" y="172" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">滑窗</text>
  <text x="210" y="188" font-size="10.5" text-anchor="middle" fill="#57606a">x[i:i+L]</text>
  <text x="210" y="201" font-size="10.5" text-anchor="middle" fill="#57606a">y[i+1:i+L+1]</text>

  <!-- window example -->
  <rect x="300" y="60" width="200" height="60" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.4"/>
  <text x="400" y="82" font-size="11" text-anchor="middle" fill="#1f2328">context_len=5</text>
  <text x="400" y="100" font-size="10.5" text-anchor="middle" fill="#57606a">x=[0,1,2,3,4] → y=[1,2,3,4,5]</text>
  <text x="400" y="114" font-size="9.5" text-anchor="middle" fill="#57606a">12 长序列 → 7 个样本</text>

  <!-- examples list -->
  <rect x="300" y="150" width="120" height="55" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="360" y="174" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">(x, y) 样本</text>
  <text x="360" y="190" font-size="10.5" text-anchor="middle" fill="#57606a">逐位错开</text>

  <!-- batch pad -->
  <rect x="450" y="150" width="120" height="55" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="510" y="172" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">batch + pad</text>
  <text x="510" y="188" font-size="10.5" text-anchor="middle" fill="#57606a">右侧补 pad_id</text>

  <!-- X Y mask -->
  <rect x="470" y="240" width="180" height="55" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="560" y="262" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">X, Y, mask</text>
  <text x="560" y="278" font-size="10" text-anchor="middle" fill="#57606a">mask 1=真实 / 0=pad</text>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="120" y1="177" x2="146" y2="177"/>
    <line x1="270" y1="177" x2="296" y2="177"/>
    <line x1="420" y1="177" x2="446" y2="177"/>
    <line x1="570" y1="177" x2="585" y2="240"/>
    <path d="M210 120 C 210 140, 320 145, 360 148" fill="none" stroke="#bf8700" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  </g>
  <text x="20" y="312" font-size="10.5" fill="#57606a">demo 实测：id 长 12、L=5 → 7 样本；batch 内最长=5，X=[[1,2,3,0,0],[5,6,7,8,9]]，mask 标出 pad。</text>
</svg>
