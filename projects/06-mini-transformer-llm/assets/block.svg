<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">M06 Transformer Block（Pre-LN）：注意力 + 残差 + FFN</text>
  <text x="20" y="48" font-size="11.5" fill="#57606a">h = x + MHA(LN(x))； out = h + FFN(LN(h))。残差让梯度直接流回浅层。</text>

  <!-- x in -->
  <rect x="20" y="140" width="80" height="50" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="60" y="163" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">x</text>
  <text x="60" y="179" font-size="10.5" text-anchor="middle" fill="#57606a">(seq,d)</text>

  <!-- LN1 -->
  <rect x="130" y="140" width="80" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="170" y="163" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">LN₁</text>
  <text x="170" y="179" font-size="10" text-anchor="middle" fill="#57606a">γ,β 可学</text>

  <!-- MHA -->
  <rect x="240" y="140" width="110" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="295" y="163" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">MHA</text>
  <text x="295" y="179" font-size="10" text-anchor="middle" fill="#57606a">见 M05</text>

  <!-- residual add 1 -->
  <circle cx="395" cy="165" r="22" fill="#fff8e6" stroke="#bf8700" stroke-width="1.6"/>
  <text x="395" y="171" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">+</text>

  <!-- h -->
  <rect x="450" y="140" width="80" height="50" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="490" y="163" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">h</text>
  <text x="490" y="179" font-size="10.5" text-anchor="middle" fill="#57606a">(seq,d)</text>

  <!-- LN2 -->
  <rect x="130" y="240" width="80" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="170" y="263" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">LN₂</text>
  <text x="170" y="279" font-size="10" text-anchor="middle" fill="#57606a">γ,β 可学</text>

  <!-- FFN -->
  <rect x="240" y="240" width="110" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="295" y="263" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">FFN</text>
  <text x="295" y="279" font-size="10" text-anchor="middle" fill="#57606a">d→d_ff→d·ReLU</text>

  <!-- residual add 2 -->
  <circle cx="395" cy="265" r="22" fill="#fff8e6" stroke="#bf8700" stroke-width="1.6"/>
  <text x="395" y="271" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">+</text>

  <!-- out -->
  <rect x="470" y="240" width="110" height="50" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="525" y="263" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">out</text>
  <text x="525" y="279" font-size="10.5" text-anchor="middle" fill="#57606a">(seq,d_model)</text>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="100" y1="165" x2="126" y2="165"/>
    <line x1="210" y1="165" x2="236" y2="165"/>
    <line x1="350" y1="165" x2="446" y2="165"/>
    <line x1="530" y1="165" x2="530" y2="235"/>
    <line x1="370" y1="200" x2="220" y2="240" stroke-dasharray="4 3"/>
    <line x1="170" y1="190" x2="170" y2="240"/>
    <line x1="350" y1="265" x2="466" y2="265"/>
    <line x1="580" y1="265" x2="620" y2="200"/>
  </g>
  <path d="M60 190 C 60 230, 30 240, 20 240" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="20" y="312" font-size="10.5" fill="#57606a">demo 实测：d_model=16,n_heads=4,d_ff=32；子层全零时 out≈x（残差生效）；所有参数都拿到梯度。</text>
</svg>
