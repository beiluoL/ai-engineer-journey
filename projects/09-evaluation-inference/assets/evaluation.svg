<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="27" font-size="16" font-weight="700" fill="#1f2328">M01 评估指标体系：一次前向，四个指标</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">困惑度只回答「分布拟合得好不好」；命中率、校准、覆盖率各补一个盲区。</text>

  <!-- input -->
  <rect x="20" y="72" width="120" height="48" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="80" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">held-out 8 条</text>
  <text x="80" y="109" font-size="10" text-anchor="middle" fill="#57606a">x / y / mask</text>

  <rect x="160" y="72" width="110" height="48" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="215" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">前向 + softmax</text>
  <text x="215" y="109" font-size="10" text-anchor="middle" fill="#57606a">fp64，-log(p+1e-300)</text>

  <rect x="290" y="72" width="130" height="48" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="355" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">prediction_arrays</text>
  <text x="355" y="109" font-size="10" text-anchor="middle" fill="#57606a">mask 筛过、位置对齐</text>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="96" x2="156" y2="96"/>
    <line x1="270" y1="96" x2="286" y2="96"/>
  </g>

  <!-- three arrays -->
  <rect x="440" y="62" width="220" height="26" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="450" y="79" font-size="10.5" fill="#1f2328">target_probs → 困惑度</text>
  <rect x="440" y="92" width="220" height="26" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="450" y="109" font-size="10.5" fill="#1f2328">confidences → 校准 / ECE</text>
  <rect x="440" y="122" width="220" height="26" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="450" y="139" font-size="10.5" fill="#1f2328">correct → Token Accuracy</text>
  <path d="M420 96 L436 96" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- metric boxes -->
  <rect x="20" y="176" width="150" height="70" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="95" y="197" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2328">困惑度 PPL</text>
  <text x="95" y="215" font-size="10.5" text-anchor="middle" fill="#57606a">exp(mean NLL)</text>
  <text x="95" y="233" font-size="10.5" text-anchor="middle" fill="#1f2328">全序列 5500.5052</text>
  <text x="95" y="248" font-size="10.5" text-anchor="middle" fill="#1f2328">答案区 5496.7621</text>

  <rect x="185" y="176" width="150" height="70" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="260" y="197" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2328">Token Accuracy</text>
  <text x="260" y="215" font-size="10.5" text-anchor="middle" fill="#57606a">argmax == target</text>
  <text x="260" y="233" font-size="10.5" text-anchor="middle" fill="#1f2328">6.0456%</text>
  <text x="260" y="248" font-size="10.5" text-anchor="middle" fill="#57606a">随机基线 1/1024</text>

  <rect x="350" y="176" width="150" height="70" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="425" y="197" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2328">ECE + 可靠性分箱</text>
  <text x="425" y="215" font-size="10.5" text-anchor="middle" fill="#57606a">Σ n_b/n · |conf − acc|</text>
  <text x="425" y="233" font-size="10.5" text-anchor="middle" fill="#1f2328">0.0927（10 箱）</text>
  <text x="425" y="248" font-size="10.5" text-anchor="middle" fill="#57606a">conf 0.1530 vs acc 0.0633</text>

  <rect x="515" y="176" width="145" height="70" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="587" y="197" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2328">答案区覆盖率</text>
  <text x="587" y="215" font-size="10.5" text-anchor="middle" fill="#57606a">Σmask / Σtokens</text>
  <text x="587" y="233" font-size="10.5" text-anchor="middle" fill="#1f2328">99.31%</text>
  <text x="587" y="248" font-size="10.5" text-anchor="middle" fill="#57606a">1009 / 1016</text>

  <g stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="95" y1="140" x2="95" y2="172"/>
    <line x1="260" y1="140" x2="260" y2="172"/>
    <line x1="425" y1="140" x2="425" y2="172"/>
    <line x1="587" y1="140" x2="587" y2="172"/>
  </g>

  <!-- note box -->
  <rect x="20" y="272" width="640" height="30" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="291" font-size="10.5" fill="#1f2328">踩坑：覆盖率 99.31% → 全序列与答案区 PPL 仅差 0.068%，mask 在本例失去分辨力（不可外推到长 prompt / 短答案）。</text>

  <rect x="20" y="312" width="640" height="30" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="331" font-size="10.5" fill="#1f2328">踩坑：10 个置信度箱有 7 个为空，ECE 0.0927 几乎由单箱决定 → 小评估集上必须读可靠性表，不能只看标量。</text>
</svg>
