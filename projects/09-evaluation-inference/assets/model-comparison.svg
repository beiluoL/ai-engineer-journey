<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="27" font-size="16" font-weight="700" fill="#1f2328">M05 多模型配对比较：8 条样本 → 10 seed bootstrap</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">同一 seed 使用同一组重采样下标 → 抽样噪声成为共模项，相减时抵消。</text>

  <!-- per-example CE -->
  <rect x="20" y="62" width="128" height="52" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="84" y="82" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2328">8 条 × 4 模型</text>
  <text x="84" y="98" font-size="10" text-anchor="middle" fill="#57606a">逐条 mean_ce</text>
  <text x="84" y="110" font-size="9.5" text-anchor="middle" fill="#57606a">（比较 CE 不是 PPL）</text>

  <!-- models -->
  <rect x="164" y="62" width="112" height="52" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="220" y="80" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">基座</text>
  <text x="220" y="96" font-size="10" text-anchor="middle" fill="#1f2328">8.663687</text>
  <text x="220" y="110" font-size="9.5" text-anchor="middle" fill="#57606a">±0.246029 基线</text>

  <rect x="288" y="62" width="112" height="52" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="344" y="80" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">加载 adapter</text>
  <text x="344" y="96" font-size="10" text-anchor="middle" fill="#1f2328">6.534930</text>
  <text x="344" y="110" font-size="9.5" text-anchor="middle" fill="#57606a">±0.046898</text>

  <rect x="412" y="62" width="112" height="52" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="468" y="80" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">合并后</text>
  <text x="468" y="96" font-size="10" text-anchor="middle" fill="#1f2328">6.534930</text>
  <text x="468" y="110" font-size="9.5" text-anchor="middle" fill="#57606a">±0.046898</text>

  <rect x="536" y="62" width="124" height="52" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="598" y="80" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">INT8 量化后</text>
  <text x="598" y="96" font-size="10" text-anchor="middle" fill="#1f2328">6.535125</text>
  <text x="598" y="110" font-size="9.5" text-anchor="middle" fill="#57606a">±0.046844</text>

  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="148" y1="88" x2="160" y2="86"/>
    <line x1="148" y1="88" x2="284" y2="86"/>
    <line x1="148" y1="88" x2="408" y2="86"/>
    <line x1="148" y1="88" x2="532" y2="86"/>
  </g>

  <!-- bootstrap engine -->
  <rect x="164" y="132" width="496" height="52" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="412" y="152" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2328">bootstrap(seed)：rng = default_rng(seed) → 同一组下标给所有模型</text>
  <text x="412" y="169" font-size="10" text-anchor="middle" fill="#57606a">seed 0..9 各取一次 → 每组 10 个 mean_ce → paired_compare 逐 seed 相减</text>
  <text x="412" y="180" font-size="9.5" text-anchor="middle" fill="#57606a">signs：improvement &gt; atol → +1；&lt; -atol → -1；否则 0（平）</text>

  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="220" y1="114" x2="220" y2="128"/>
    <line x1="344" y1="114" x2="344" y2="128"/>
    <line x1="468" y1="114" x2="468" y2="128"/>
    <line x1="598" y1="114" x2="598" y2="128"/>
  </g>

  <!-- results -->
  <rect x="20" y="200" width="310" height="86" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="218" font-size="11" font-weight="600" fill="#1f2328">相对基座（配对，越低越好）</text>
  <text x="34" y="236" font-size="10.5" fill="#1f2328">加载 adapter　10 / 0 / 0　稳定 是</text>
  <text x="34" y="252" font-size="10.5" fill="#1f2328">合并后　　　　10 / 0 / 0　稳定 是</text>
  <text x="34" y="268" font-size="10.5" fill="#1f2328">INT8 量化后　　10 / 0 / 0　稳定 是</text>
  <text x="34" y="281" font-size="9.5" fill="#57606a">噪声内翻转：无　（均值差 2.128757 ≈ 45× std）</text>

  <rect x="350" y="200" width="310" height="86" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.4"/>
  <text x="362" y="218" font-size="11" font-weight="600" fill="#c0392b">adapter vs 合并后 = 0 / 0 / 10</text>
  <text x="364" y="236" font-size="10.5" fill="#1f2328">不是缺数据，是等价性的正面证据：</text>
  <text x="364" y="252" font-size="10.5" fill="#1f2328">merge: W' = W + (α/r)·A·B</text>
  <text x="364" y="268" font-size="10.5" fill="#1f2328">LoRALinear 前向即时合成同一个式子</text>
  <text x="364" y="281" font-size="9.5" fill="#57606a">→ 数学等价；atol=1e-10 内 10/10 全平</text>

  <!-- key insight -->
  <rect x="20" y="298" width="640" height="26" rx="6" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.2"/>
  <text x="32" y="315" font-size="10.5" fill="#1f2328">核心价值：配对设计分辨出 0.000195 的差异（仅 std 0.046898 的 0.42%，约 1/240）—— 独立重采样必被噪声淹没。</text>

  <rect x="20" y="330" width="640" height="22" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="345" font-size="10.5" fill="#1f2328">诚实标注：adapter 只训 24 步（loss 8.4440 → 6.4789），绝对指标难看，但相对排序 10/0/0 可信。</text>
</svg>
