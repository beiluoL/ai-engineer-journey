<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="27" font-size="16" font-weight="700" fill="#1f2328">M02 Benchmark：任务集 → 统一打分 → 排行</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">同一任务 + 同一评分函数 + 同一汇总口径，三者齐备分数才可比较。</text>

  <!-- task set -->
  <rect x="20" y="66" width="150" height="72" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="95" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2328">Benchmark</text>
  <text x="95" y="105" font-size="10.5" text-anchor="middle" fill="#57606a">Java held-out v1</text>
  <text x="95" y="121" font-size="10.5" text-anchor="middle" fill="#1f2328">6 任务 / 4 主题</text>
  <text x="95" y="134" font-size="9.5" text-anchor="middle" fill="#57606a">task_id 唯一性校验</text>

  <!-- three predictors -->
  <text x="196" y="72" font-size="11" font-weight="600" fill="#1f2328">predictor: str → str（模型只是一个函数）</text>
  <rect x="196" y="80" width="140" height="52" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="266" y="99" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">参考答案</text>
  <text x="266" y="115" font-size="10" text-anchor="middle" fill="#57606a">上界（理论最优）</text>
  <text x="266" y="128" font-size="10" text-anchor="middle" fill="#57606a">直接返回 output</text>

  <rect x="196" y="138" width="140" height="52" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="266" y="157" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">首句摘要</text>
  <text x="266" y="173" font-size="10" text-anchor="middle" fill="#57606a">消融（砍掉 2/3）</text>
  <text x="266" y="186" font-size="10" text-anchor="middle" fill="#57606a">只留第一句</text>

  <rect x="196" y="196" width="140" height="52" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="266" y="215" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">弱基线</text>
  <text x="266" y="231" font-size="10" text-anchor="middle" fill="#57606a">下界（车轱辘话）</text>
  <text x="266" y="244" font-size="10" text-anchor="middle" fill="#57606a">固定 13 字</text>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="170" y1="102" x2="192" y2="106"/>
    <line x1="170" y1="102" x2="192" y2="160"/>
    <line x1="170" y1="102" x2="192" y2="218"/>
  </g>

  <!-- scorer -->
  <rect x="360" y="80" width="150" height="168" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="435" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2328">evaluate_answer</text>
  <text x="375" y="120" font-size="10.5" fill="#1f2328">关键词   ×0.40</text>
  <text x="375" y="138" font-size="10.5" fill="#1f2328">格式     ×0.15</text>
  <text x="375" y="156" font-size="10.5" fill="#1f2328">长度     ×0.15</text>
  <text x="375" y="174" font-size="10.5" fill="#1f2328">忠实度   ×0.20</text>
  <text x="375" y="192" font-size="10.5" fill="#1f2328">去重复   ×0.10</text>
  <line x1="372" y1="202" x2="498" y2="202" stroke="#bf8700" stroke-width="1"/>
  <text x="375" y="218" font-size="10" fill="#57606a">aggregate_scores</text>
  <text x="375" y="233" font-size="10" fill="#57606a">6 题算术平均</text>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="336" y1="106" x2="356" y2="120"/>
    <line x1="336" y1="164" x2="356" y2="164"/>
    <line x1="336" y1="222" x2="356" y2="208"/>
  </g>

  <!-- ranking -->
  <rect x="534" y="80" width="126" height="168" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="597" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2328">排行榜</text>
  <text x="597" y="119" font-size="10.5" text-anchor="middle" fill="#1f2328">1 参考答案 94.38</text>
  <text x="597" y="136" font-size="10.5" text-anchor="middle" fill="#1f2328">2 首句摘要 75.56</text>
  <text x="597" y="153" font-size="10.5" text-anchor="middle" fill="#1f2328">3 弱基线　21.87</text>
  <line x1="546" y1="164" x2="648" y2="164" stroke="#4a9d5f" stroke-width="1"/>
  <text x="597" y="180" font-size="9.5" text-anchor="middle" fill="#57606a">sort(-total, model)</text>
  <text x="597" y="194" font-size="9.5" text-anchor="middle" fill="#57606a">全序 → 可复现</text>
  <text x="597" y="215" font-size="9.5" text-anchor="middle" fill="#c0392b">参考答案 ≠ 100</text>
  <text x="597" y="229" font-size="9.5" text-anchor="middle" fill="#57606a">格式 0.700 拖分</text>
  <text x="597" y="243" font-size="9.5" text-anchor="middle" fill="#57606a">去重复 0.888</text>

  <path d="M510 164 L530 164" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- notes -->
  <rect x="20" y="272" width="640" height="34" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="287" font-size="10.5" fill="#1f2328">踩坑：忠实度 = |A∩R| / |A|，分母是答案自身 → 只惩罚「胡说」不惩罚「少说」；首句摘要忠实度 1.000，靠长度项 0.639 兜底。</text>
  <text x="32" y="301" font-size="10.5" fill="#57606a">规则：任何比值型指标，先问分母是什么。</text>

  <rect x="20" y="316" width="640" height="30" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="335" font-size="10.5" fill="#1f2328">踩坑：弱基线去重复满分 1.000 却总分 21.87（忠实度 0.015）→ 单一维度不能判优劣，必须看加权总分 + 分项表。</text>
</svg>
