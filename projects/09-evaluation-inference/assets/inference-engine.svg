<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="27" font-size="16" font-weight="700" fill="#1f2328">M07 自回归引擎：无 KV 全量重算 vs 有 KV 增量解码</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">41 token prompt → 生成 16 token；实测 6.155 ms → 2.794 ms = 2.20×</text>

  <!-- no cache -->
  <rect x="20" y="62" width="300" height="150" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="32" y="80" font-size="12" font-weight="700" fill="#1f2328">无 KV Cache：每步重算整个前缀</text>
  <rect x="34" y="88" width="130" height="18" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="40" y="101" font-size="9" fill="#57606a">step 1: forward(41)</text>
  <rect x="34" y="110" width="168" height="18" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="40" y="123" font-size="9" fill="#57606a">step 2: forward(42)  ← 41 重算</text>
  <rect x="34" y="132" width="206" height="18" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="40" y="145" font-size="9" fill="#57606a">step 3: forward(43)  ← 42 重算</text>
  <text x="40" y="163" font-size="9" fill="#57606a">…</text>
  <rect x="34" y="170" width="272" height="18" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="40" y="183" font-size="9" fill="#57606a">step 16: forward(56) ← 55 全部重算</text>
  <text x="34" y="203" font-size="10.5" fill="#1f2328">累计处理 776 个 token 位置</text>

  <!-- with cache -->
  <rect x="360" y="62" width="300" height="150" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="372" y="80" font-size="12" font-weight="700" fill="#1f2328">有 KV Cache：prefill 一次 + 每步 1 token</text>
  <rect x="374" y="88" width="272" height="18" fill="#ffffff" stroke="#4a9d5f" stroke-width="1"/>
  <text x="380" y="101" font-size="9" fill="#57606a">prefill: forward(41) → 缓存 K/V（2 层）</text>
  <rect x="374" y="110" width="60" height="18" fill="#ffffff" stroke="#4a9d5f" stroke-width="1"/>
  <text x="380" y="123" font-size="9" fill="#57606a">decode ×1</text>
  <rect x="440" y="110" width="60" height="18" fill="#ffffff" stroke="#4a9d5f" stroke-width="1"/>
  <text x="446" y="123" font-size="9" fill="#57606a">decode ×1</text>
  <rect x="506" y="110" width="60" height="18" fill="#ffffff" stroke="#4a9d5f" stroke-width="1"/>
  <text x="512" y="123" font-size="9" fill="#57606a">decode ×1</text>
  <text x="374" y="145" font-size="9" fill="#57606a">… 共 16 步，每步只算新 token 的 Q，K/V 从缓存读</text>
  <rect x="374" y="154" width="272" height="18" fill="#ffffff" stroke="#4a9d5f" stroke-width="1"/>
  <text x="380" y="167" font-size="9" fill="#57606a">decode_step：pos = pe[start_pos]，无 causal mask</text>
  <text x="374" y="188" font-size="10.5" fill="#1f2328">累计处理 57 个 token 位置（省 13.6×）</text>
  <text x="374" y="203" font-size="10.5" fill="#c0392b">但实测只快 2.20× —— 固定开销吃掉大半</text>

  <!-- result bar -->
  <rect x="20" y="226" width="640" height="46" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="244" font-size="11" font-weight="700" fill="#1f2328">实测（7 轮中位数）　无缓存 6.155 ms　有缓存 2.794 ms　加速 2.20×　生成 token 全等 True</text>
  <text x="32" y="262" font-size="10.5" fill="#1f2328">反解固定开销：(16O + 776c) / (17O + 57c) = 2.20 → O ≈ 30c（推算）</text>

  <!-- correctness -->
  <rect x="20" y="282" width="313" height="46" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="32" y="300" font-size="11" font-weight="700" fill="#1f2328">正确性：比对 logits，不是 argmax</text>
  <text x="34" y="316" font-size="10" fill="#1f2328">decode_step vs 全量 forward 单步最大误差</text>
  <text x="34" y="325" font-size="10" fill="#4a9d5f">4.441e-15（阈值 1e-8，fp64 舍入级别）</text>

  <rect x="347" y="282" width="313" height="46" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="359" y="300" font-size="11" font-weight="700" fill="#1f2328">计时纪律：两路都 warmup + 取中位数</text>
  <text x="361" y="316" font-size="10" fill="#1f2328">7 轮加速 1.91 / 2.22 / 2.23 / 2.26 / 2.20</text>
  <text x="361" y="325" font-size="10" fill="#1f2328">　/ 2.20 / 2.57× —— 均值会被离群值拉偏</text>

  <rect x="20" y="334" width="640" height="20" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.2"/>
  <text x="32" y="348" font-size="10" fill="#c0392b">⚠ 2.20× 是 d_model=64 / 2 层玩具模型的数字，别拿它推大模型（业界 7B 常见 5~20×，非本机实测）。</text>
</svg>
