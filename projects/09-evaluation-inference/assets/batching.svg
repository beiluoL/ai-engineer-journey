<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="27" font-size="16" font-weight="700" fill="#1f2328">M09 Static vs Continuous Batching 时序对比</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">12 请求 / batch 4 / step_ms = 0.1342 ms（101 次真实引擎实测）</text>

  <!-- static -->
  <rect x="20" y="62" width="640" height="118" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="32" y="80" font-size="12" font-weight="700" fill="#1f2328">Static：整批一起进、一起出（批耗时 = 批内最长）</text>

  <text x="34" y="98" font-size="9" fill="#57606a">槽0</text>
  <rect x="60" y="90" width="24" height="12" fill="#4a9d5f"/>
  <rect x="86" y="90" width="126" height="12" fill="#ffffff" stroke="#c0392b" stroke-width="0.8"/>
  <text x="34" y="113" font-size="9" fill="#57606a">槽1</text>
  <rect x="60" y="105" width="112" height="12" fill="#4a9d5f"/>
  <rect x="174" y="105" width="38" height="12" fill="#ffffff" stroke="#c0392b" stroke-width="0.8"/>
  <text x="34" y="128" font-size="9" fill="#57606a">槽2</text>
  <rect x="60" y="120" width="48" height="12" fill="#4a9d5f"/>
  <rect x="110" y="120" width="102" height="12" fill="#ffffff" stroke="#c0392b" stroke-width="0.8"/>
  <text x="34" y="143" font-size="9" fill="#57606a">槽3</text>
  <rect x="60" y="135" width="150" height="12" fill="#4a9d5f"/>
  <text x="222" y="100" font-size="8.5" fill="#c0392b">批次 1：20 步（3/14/6/20 → 空转 37 slot）</text>
  <text x="222" y="122" font-size="8.5" fill="#c0392b">批次 2：17 步　批次 3：13 步</text>
  <text x="222" y="140" font-size="8.5" fill="#c0392b">总时长 50 步 = 6.71 ms</text>
  <text x="222" y="155" font-size="8.5" fill="#1f2328">占用槽位 200，实际工作 110 → 空闲 90（45.0%）</text>

  <text x="440" y="88" font-size="9" fill="#57606a">■ 有效工作　□ 空转槽位</text>
  <rect x="440" y="93" width="14" height="9" fill="#4a9d5f"/>
  <rect x="460" y="93" width="14" height="9" fill="#ffffff" stroke="#c0392b" stroke-width="0.8"/>

  <!-- continuous -->
  <rect x="20" y="192" width="640" height="118" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="32" y="210" font-size="12" font-weight="700" fill="#1f2328">Continuous：每一步都重新组批，谁完成谁出队、空位立刻补人</text>

  <text x="34" y="228" font-size="9" fill="#57606a">槽0</text>
  <rect x="60" y="220" width="24" height="12" fill="#4a9d5f"/>
  <rect x="86" y="220" width="48" height="12" fill="#4a9d5f"/>
  <rect x="136" y="220" width="64" height="12" fill="#4a9d5f"/>
  <rect x="202" y="220" width="18" height="12" fill="#ffffff" stroke="#4a9d5f" stroke-width="0.8"/>
  <text x="34" y="253" font-size="9" fill="#57606a">槽1</text>
  <rect x="60" y="245" width="112" height="12" fill="#4a9d5f"/>
  <rect x="174" y="245" width="24" height="12" fill="#4a9d5f"/>
  <rect x="200" y="245" width="20" height="12" fill="#ffffff" stroke="#4a9d5f" stroke-width="0.8"/>
  <text x="34" y="278" font-size="9" fill="#57606a">槽2</text>
  <rect x="60" y="270" width="48" height="12" fill="#4a9d5f"/>
  <rect x="110" y="270" width="88" height="12" fill="#4a9d5f"/>
  <rect x="200" y="270" width="20" height="12" fill="#ffffff" stroke="#4a9d5f" stroke-width="0.8"/>
  <text x="34" y="303" font-size="9" fill="#57606a">槽3</text>
  <rect x="60" y="295" width="150" height="12" fill="#4a9d5f"/>
  <text x="222" y="232" font-size="8.5" fill="#4a9d5f">r00 完成 → 槽位立刻补入 r04</text>
  <text x="222" y="252" font-size="8.5" fill="#4a9d5f">每步重排，无队尾等待</text>
  <text x="222" y="272" font-size="8.5" fill="#4a9d5f">总时长 33 步 = 4.43 ms</text>
  <text x="222" y="288" font-size="8.5" fill="#1f2328">占用槽位 132，实际工作 110 → 空闲 22（16.7%）</text>
  <text x="222" y="303" font-size="8.5" fill="#1f2328">总工作量恒定 110（策略无关不变量）</text>

  <!-- results -->
  <rect x="20" y="322" width="313" height="32" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="336" font-size="10" fill="#1f2328">吞吐 1788.27 → 2709.50 req/s（1.52×）</text>
  <text x="32" y="348" font-size="10" fill="#1f2328">平均延迟 2.78 → 1.34 ms（−51.8%）</text>

  <rect x="347" y="322" width="313" height="32" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="359" y="336" font-size="10" fill="#1f2328">p95 4.36 → 2.46 ms（−43.5%，长尾改善小于均值）</text>
  <text x="359" y="348" font-size="10" fill="#c0392b">⚠ 仿真非真实 GPU 批处理，1.52× 为乐观上界</text>
</svg>
