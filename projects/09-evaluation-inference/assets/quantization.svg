<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="27" font-size="16" font-weight="700" fill="#1f2328">M06 量化：per-tensor vs per-channel 粒度 + INT8 / INT4 / NF4</text>
  <text x="20" y="47" font-size="11.5" fill="#57606a">基准矩阵 decoder.proj (64, 1024) = 65,536 参数，fp32 = 262,144 B</text>

  <!-- per-tensor -->
  <rect x="20" y="62" width="300" height="96" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="32" y="80" font-size="12" font-weight="700" fill="#1f2328">per_tensor：整张矩阵 1 个 scale</text>
  <rect x="34" y="88" width="272" height="26" fill="#ffffff" stroke="#8c959f" stroke-width="1"/>
  <text x="40" y="105" font-size="9.5" fill="#57606a">W（64×1024）→ 全局 absmax → 1 × fp32</text>
  <text x="34" y="132" font-size="10.5" fill="#1f2328">INT8 存储 = 65,536 × 1B + 4B = 65,540 B</text>
  <text x="34" y="147" font-size="10.5" fill="#1f2328">压缩 = 4.00×　scale 占比 0.006%</text>

  <!-- per-channel -->
  <rect x="340" y="62" width="320" height="96" rx="8" fill="#eef4ff" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="352" y="80" font-size="12" font-weight="700" fill="#1f2328">per_channel：每通道 1 个 scale（本章实测口径）</text>
  <rect x="354" y="88" width="296" height="26" fill="#ffffff" stroke="#4a7fd4" stroke-width="1"/>
  <text x="360" y="105" font-size="9.5" fill="#57606a">沿 axis=−1 → 1024 个 absmax → 1024 × fp32 = 4,096 B</text>
  <text x="354" y="132" font-size="10.5" fill="#1f2328">INT8 存储 = 65,536 × 1B + 4,096B = 69,632 B</text>
  <text x="354" y="147" font-size="10.5" fill="#1f2328">压缩 = 3.76×　scale 占比 5.88%（体积多 6.2%）</text>

  <!-- three schemes -->
  <rect x="20" y="176" width="200" height="72" rx="8" fill="#eaf6ec" stroke="#4a9d5f" stroke-width="1.5"/>
  <text x="120" y="195" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2328">INT8（qmax=127）</text>
  <text x="120" y="211" font-size="10" text-anchor="middle" fill="#1f2328">MSE 7.673e-08　相对 L2 0.003431</text>
  <text x="120" y="226" font-size="10" text-anchor="middle" fill="#1f2328">69,632 B　→　3.76×</text>
  <text x="120" y="241" font-size="10" text-anchor="middle" fill="#4a9d5f">端到端 −0.028%（第 2）</text>

  <rect x="240" y="176" width="200" height="72" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="340" y="195" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2328">INT4（qmax=7）</text>
  <text x="340" y="211" font-size="10" text-anchor="middle" fill="#1f2328">MSE 2.520e-05　相对 L2 0.062178</text>
  <text x="340" y="226" font-size="10" text-anchor="middle" fill="#1f2328">36,864 B　→　7.11×</text>
  <text x="340" y="241" font-size="10" text-anchor="middle" fill="#c0392b">端到端 +0.119%（第 3，唯一变差）</text>

  <rect x="460" y="176" width="200" height="72" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="560" y="195" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2328">NF4（16 码字，分位数）</text>
  <text x="560" y="211" font-size="10" text-anchor="middle" fill="#1f2328">MSE 5.246e-05　相对 L2 0.089720</text>
  <text x="560" y="226" font-size="10" text-anchor="middle" fill="#1f2328">33,808 B　→　7.75×</text>
  <text x="560" y="241" font-size="10" text-anchor="middle" fill="#4a9d5f">端到端 −4.088%（第 1）</text>

  <!-- reversal arrows -->
  <rect x="20" y="260" width="640" height="36" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.4"/>
  <text x="32" y="276" font-size="11" font-weight="700" fill="#c0392b">⭐ 反直觉：MSE 排名 INT8 &lt; INT4 &lt; NF4，端到端排名 NF4 &lt; INT8 &lt; INT4 —— 完全相反</text>
  <text x="32" y="291" font-size="10" fill="#1f2328">NF4 的权重 MSE 是 INT8 的 684 倍（5.246e-05 ÷ 7.673e-08 = 683.8），端到端 PPL 却低 224.71（−4.088%）</text>

  <path d="M120 248 C 120 256, 560 256, 560 248" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>

  <!-- bottom notes -->
  <rect x="20" y="304" width="313" height="26" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="321" font-size="10" fill="#1f2328">PPL = exp(CE)：−4.088% 对应 CE 仅 −0.0418（相对 0.485%）</text>

  <rect x="347" y="304" width="313" height="26" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="359" y="321" font-size="10" fill="#1f2328">⚠ 遍历参数须用 P08 named_parameters，绕开 P06 漏词嵌入</text>

  <rect x="20" y="336" width="640" height="20" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="32" y="350" font-size="10" fill="#57606a">口径自检：FP64 基线 5496.7621 与 M01 答案区 PPL 完全一致（同 held-out 8 / 同 batch_size 2 / 同 fp64）。</text>
</svg>
